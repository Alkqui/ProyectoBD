<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Centro de Idiomas - Iniciar Sesión</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            sage: {
              bg: '#F6F7F4',
              card: '#FFFFFF',
              text: '#222B25',
              subtext: '#667068',
              border: '#DDE2DB',
              accent: '#4F6F52',
              hover: '#3A5A40',
              light: '#E8EBE7'
            }
          }
        }
      }
    }
  </script>
  <style>
    body { background-color: #F6F7F4; color: #222B25; }
    .fade-in { animation: fadeIn 0.5s ease-out forwards; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Transitions for the tabs */
    .tab-btn { transition: all 0.2s ease; }
    .tab-active {
      background-color: #FFFFFF;
      color: #4F6F52;
      border-bottom-color: #FFFFFF !important;
      font-weight: 700;
    }
    .tab-inactive {
      background-color: #E8EBE7;
      color: #667068;
      border-bottom-color: #DDE2DB;
    }
    .tab-inactive:hover {
      color: #222B25;
      background-color: #f0f2ef;
    }
  </style>
</head>
<body class="h-full flex items-center justify-center font-sans selection:bg-sage-accent selection:text-white p-4">

  <!-- Main Container -->
  <main class="w-full max-w-md fade-in">
    <!-- Branding Header -->
    <div class="text-center mb-8">
      <div class="mx-auto w-16 h-16 rounded-2xl bg-sage-accent flex items-center justify-center text-white shadow-lg mb-4">
        <i data-lucide="languages" class="w-8 h-8"></i>
      </div>
      <h1 class="text-3xl font-extrabold text-sage-text tracking-tight">Centro de Idiomas</h1>
      <p class="text-sm text-sage-subtext mt-2">Sistema Integral de Gestión Académica</p>
    </div>

    <!-- Container for Tabs + Card -->
    <div class="rounded-2xl shadow-sm overflow-hidden border border-sage-border flex flex-col bg-sage-card">

      <!-- Role Selection Tabs -->
      <div class="flex w-full">
        <!-- Estudiante Tab -->
        <button id="tab-estudiante" onclick="switchRole('estudiante')" class="tab-btn tab-active flex-1 py-3.5 flex items-center justify-center gap-2 text-sm border-b border-r">
          <i data-lucide="backpack" class="w-4 h-4"></i> Estudiante
        </button>
        <!-- Personal Tab -->
        <button id="tab-personal" onclick="switchRole('personal')" class="tab-btn tab-inactive flex-1 py-3.5 flex items-center justify-center gap-2 text-sm border-b">
          <i data-lucide="shield-check" class="w-4 h-4"></i> Personal Docente / Admin
        </button>
      </div>

      <!-- Login Card Form Area -->
      <div class="p-6 sm:p-8">

        <div class="flex items-center justify-between mb-6">
          <h2 class="text-xl font-bold text-sage-text" id="form-title">Portal Estudiantil</h2>
          <span id="role-badge" class="px-2 py-1 bg-emerald-100 text-emerald-800 text-[10px] font-bold uppercase rounded border border-emerald-200">Acceso Alumnos</span>
        </div>

        <form id="login-form" onsubmit="handleLogin(event)" class="space-y-5">

          <!-- Hidden Input for Role -->
          <input type="hidden" id="login-role" name="role" value="estudiante">

          <!-- User ID Field -->
          <div>
            <label id="lbl-user" for="user-id" class="block text-xs font-bold text-sage-subtext uppercase tracking-wider mb-1.5">Matrícula</label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-sage-subtext">
                <i id="icon-user" data-lucide="user" class="w-4 h-4"></i>
              </div>
              <input type="text" id="user-id" name="user_id" required placeholder="Ej. A01234567"
                     class="w-full bg-sage-bg border border-sage-border rounded-lg pl-10 pr-4 py-2.5 text-sm focus:outline-none focus:border-sage-accent focus:ring-1 focus:ring-sage-accent transition-colors">
            </div>
          </div>

          <!-- Password Field -->
          <div>
            <div class="flex items-center justify-between mb-1.5">
              <label for="password" class="block text-xs font-bold text-sage-subtext uppercase tracking-wider">Contraseña</label>
              <a href="#" class="text-xs font-medium text-sage-accent hover:text-sage-hover transition-colors">¿Olvidaste tu contraseña?</a>
            </div>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-sage-subtext">
                <i data-lucide="lock" class="w-4 h-4"></i>
              </div>
              <input type="password" id="password" name="password" required placeholder="••••••••"
                     class="w-full bg-sage-bg border border-sage-border rounded-lg pl-10 pr-10 py-2.5 text-sm focus:outline-none focus:border-sage-accent focus:ring-1 focus:ring-sage-accent transition-colors">
              <button type="button" onclick="togglePassword()" class="absolute inset-y-0 right-0 pr-3 flex items-center text-sage-subtext hover:text-sage-text transition-colors focus:outline-none">
                <i id="eye-icon" data-lucide="eye" class="w-4 h-4"></i>
              </button>
            </div>
          </div>

          <!-- Submit Button -->
          <div class="pt-2">
            <button type="submit" class="w-full flex justify-center items-center gap-2 bg-sage-accent hover:bg-sage-hover text-white font-bold rounded-lg px-4 py-3 text-sm shadow-md transition-all active:scale-[0.98]">
              <i data-lucide="log-in" class="w-4 h-4"></i> Ingresar al Sistema
            </button>
          </div>
        </form>
      </div>
    </div> <!-- End container -->

    <!-- Footer -->
    <div class="text-center mt-8 text-xs text-sage-subtext">
      &copy; 2026 Centro de Idiomas. Todos los derechos reservados.
    </div>
  </main>

  <script>
    // Initialize Lucide Icons
    lucide.createIcons();

    // Toggle Password Visibility
    function togglePassword() {
      const pwdInput = document.getElementById('password');
      const eyeIcon = document.getElementById('eye-icon');

      if (pwdInput.type === 'password') {
        pwdInput.type = 'text';
        eyeIcon.setAttribute('data-lucide', 'eye-off');
      } else {
        pwdInput.type = 'password';
        eyeIcon.setAttribute('data-lucide', 'eye');
      }
      lucide.createIcons();
    }

    // Role Switching Logic
    function switchRole(role) {
      const tabEstudiante = document.getElementById('tab-estudiante');
      const tabPersonal = document.getElementById('tab-personal');

      const formTitle = document.getElementById('form-title');
      const roleBadge = document.getElementById('role-badge');
      const lblUser = document.getElementById('lbl-user');
      const inputUser = document.getElementById('user-id');
      const iconUser = document.getElementById('icon-user');
      const hiddenRole = document.getElementById('login-role');

      // Clear the input on switch
      inputUser.value = '';

      if (role === 'estudiante') {
        // Update Tabs styling
        tabEstudiante.className = "tab-btn tab-active flex-1 py-3.5 flex items-center justify-center gap-2 text-sm border-b border-r border-sage-border";
        tabPersonal.className = "tab-btn tab-inactive flex-1 py-3.5 flex items-center justify-center gap-2 text-sm border-b border-sage-border";

        // Update Content
        hiddenRole.value = "estudiante";
        formTitle.innerText = "Portal Estudiantil";

        roleBadge.innerText = "Acceso Alumnos";
        roleBadge.className = "px-2 py-1 bg-emerald-100 text-emerald-800 text-[10px] font-bold uppercase rounded border border-emerald-200";

        lblUser.innerText = "Matrícula";
        inputUser.placeholder = "Ej. A01234567";
        iconUser.setAttribute('data-lucide', 'user');

      } else if (role === 'personal') {
        // Update Tabs styling
        tabPersonal.className = "tab-btn tab-active flex-1 py-3.5 flex items-center justify-center gap-2 text-sm border-b border-l border-sage-border";
        tabEstudiante.className = "tab-btn tab-inactive flex-1 py-3.5 flex items-center justify-center gap-2 text-sm border-b border-sage-border";

        // Update Content
        hiddenRole.value = "personal";
        formTitle.innerText = "Acceso Administrativo";

        roleBadge.innerText = "Docentes / Admin";
        roleBadge.className = "px-2 py-1 bg-sage-bg text-sage-text text-[10px] font-bold uppercase rounded border border-sage-border";

        lblUser.innerText = "Matrícula / Correo Institucional";
        inputUser.placeholder = "Ej. L09876543 o usuario@institucion.edu.mx";
        iconUser.setAttribute('data-lucide', 'mail');
      }
      
      lucide.createIcons();
    }

    // Mock Login Handler
    function handleLogin(e) {
      e.preventDefault();
      const btn = e.target.querySelector('button[type="submit"]');
      const role = document.getElementById('login-role').value;
      
      // Visual feedback loading state
      const originalText = btn.innerHTML;
      btn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Autenticando...`;
      btn.classList.add('opacity-80', 'cursor-not-allowed');
      lucide.createIcons();

      // Simulate a network request delay
      setTimeout(() => {
        // Redirección mockeada: Personal va al CRUD, estudiante lanza un panel simulado.
        if (role === 'personal') {
            window.location.href = '/menu_principal.html'; 
        } else {
            window.location.href = '/Evaluacion_y_kardex.html';
        }
      }, 1200);
    }
  </script>
</body>
</html>
